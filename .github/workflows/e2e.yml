name: E2E

# Railway's GitHub integration posts deployment statuses; this runs the
# Playwright suite against each successful PR environment deployment.
on:
  deployment_status:

concurrency:
  group: e2e-${{ github.event.deployment.environment }}
  cancel-in-progress: true

jobs:
  e2e:
    # Railway PR environments are named like "<branch>-pr-<n>"
    if: >-
      github.event.deployment_status.state == 'success' &&
      contains(github.event.deployment.environment, 'pr-')
    runs-on: ubuntu-latest
    steps:
      # Railway reports dashboard URLs in deployment_status URL fields. The
      # public service URL follows service-environment.up.railway.app.
      - name: Resolve deployment URL
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ github.event.deployment.environment }}
        run: |
          service="${DEPLOYMENT_ENVIRONMENT%%/*}"
          environment="${DEPLOYMENT_ENVIRONMENT##*/}"
          service="${service//[[:space:]]/}"
          environment="${environment//[[:space:]]/}"
          base_url="https://${service}-${environment}.up.railway.app"
          echo "BASE_URL=$base_url" >> "$GITHUB_ENV"
          echo "Testing against $base_url"
      - name: Check deployment URL
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "No deployment URL was resolved." >&2
            exit 1
          fi
          echo "Testing against $BASE_URL"
      - name: checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.deployment.sha }}
      - name: setup vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          version: '0.2.1'
          node-version: '24'
      - name: Install Playwright Browsers
        run: vpx playwright install --with-deps --only-shell
      # sleepApplication is enabled on Railway, so the first request has to
      # wake the app; retry until it responds. Follow redirects: the beta
      # gate 307s / to /auth/beta.
      - name: Wait for deployment to be reachable
        run: |
          for attempt in $(seq 1 30); do
            status=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 20 "$BASE_URL" || true)
            if [ "$status" = "200" ]; then
              echo "Deployment is up (attempt $attempt)"
              exit 0
            fi
            echo "attempt $attempt: HTTP $status, retrying in 10s"
            sleep 10
          done
          echo "Deployment never became reachable at $BASE_URL" >&2
          exit 1
      - name: Run Playwright tests
        run: vpx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            .playwright/report/
            .playwright/test-results/
          retention-days: 14
