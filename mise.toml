[env]
_.file = [".env.compose"]

[tools]
stripe-cli = "latest"

[tasks."stripe:sandbox:check"]
description = "Verify the Stripe CLI is available"
run = "stripe version"

[tasks."stripe:sandbox:create"]
description = "Create the Stripe sandbox"
run = "stripe sandbox create"

[tasks."stripe:sandbox:provision"]
description = "Create the intro-unlock product and price in the sandbox"
run = '''
#!/usr/bin/env bash
set -euo pipefail

stripe_id() {
	node -e 'let input = ""; process.stdin.on("data", (chunk) => (input += chunk)).on("end", () => process.stdout.write(JSON.parse(input).id))'
}

intro_unlock_config() {
	INTRO_UNLOCK_CONFIG_KEY="$1" node_modules/.bin/tsx -e 'import("./src/lib/payments/intro-unlock.config.ts").then((m) => console.log(m[process.env.INTRO_UNLOCK_CONFIG_KEY]))'
}

product_json="$(stripe products create \
	--confirm \
	--name 'Intro unlock' \
	--description 'One-time access to an accepted introduction')"
product_id="$(printf '%s' "$product_json" | stripe_id)"
price_json="$(stripe prices create \
	--confirm \
	--product "$product_id" \
	--unit-amount "$(intro_unlock_config INTRO_UNLOCK_PRICE_CENTS)" \
	--currency "$(intro_unlock_config INTRO_UNLOCK_CURRENCY)")"
price_id="$(printf '%s' "$price_json" | stripe_id)"

printf 'Created sandbox product %s and price %s.\n' "$product_id" "$price_id"
printf 'Set STRIPE_INTRO_UNLOCK_PRICE_ID=%s in .env.development.local.\n' "$price_id"
'''

[tasks."stripe:sandbox:listen"]
description = "Forward Stripe sandbox webhooks to the local dev server"
usage = '''
flag "--forward-to <url>" help="Webhook forward URL" default="http://localhost:3000/api/stripe-webhook"
flag "--events <events>" help="Comma-separated checkout events to listen for" default="checkout.session.completed,checkout.session.async_payment_succeeded"
'''
run = 'stripe listen --events "${usage_events?}" --forward-to "${usage_forward_to?}"'

